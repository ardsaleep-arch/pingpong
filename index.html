<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <title>Ping Pong</title>

  <style>
    :root {
      --bg-start: #0f172a;
      --bg-end: #1e1b4b;
      --panel: rgba(15, 23, 42, 0.88);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #a78bfa;
      --accent-hover: #8b5cf6;
      --left: #38bdf8;
      --right: #f472b6;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(167, 139, 250, 0.18), transparent 35%),
        linear-gradient(135deg, var(--bg-start), var(--bg-end));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button,
    select {
      font: inherit;
      touch-action: manipulation;
    }

    .game-container {
      width: min(100%, 1100px);
      padding: 18px;
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    .game-header {
      margin-bottom: 12px;
      text-align: center;
    }

    .game-header h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      line-height: 1.1;
    }

    .controls {
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: end;
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group.hidden {
      display: none;
    }

    .control-group label {
      color: var(--muted);
      font-size: 0.82rem;
    }

    select,
    .action-button {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: var(--text);
      background: #334155;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    select:focus,
    .action-button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25);
    }

    select option {
      color: white;
      background: #334155;
    }

    .action-button {
      border-color: transparent;
      background: var(--accent);
      color: #1e1b4b;
      font-weight: 800;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .action-button.secondary {
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      background: #475569;
    }

    @media (hover: hover) {
      .action-button:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      .action-button.secondary:hover {
        background: #64748b;
      }
    }

    .field-wrapper {
      position: relative;
      width: var(--field-width, 100%);
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 8 / 5;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      background: #020617;
      touch-action: none;
      cursor: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.6);
      text-align: center;
      cursor: pointer;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-title {
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      font-weight: 900;
    }

    .overlay-text {
      color: var(--muted);
      font-size: clamp(0.85rem, 2.4vw, 1.05rem);
      line-height: 1.6;
    }

    .instructions {
      margin: 12px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .action-button.hidden {
      display: none;
    }

    :fullscreen body {
      padding: 6px;
    }

    :-webkit-full-screen body {
      padding: 6px;
    }

    :fullscreen .game-container {
      width: 100%;
      padding: 10px;
    }

    :-webkit-full-screen .game-container {
      width: 100%;
      padding: 10px;
    }

    @media (max-width: 640px) {
      body {
        padding: 8px;
      }

      .game-container {
        padding: 12px 8px;
        border-radius: 16px;
      }

      .control-group,
      .action-button {
        flex: 1 1 130px;
      }

      select,
      .action-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="game-container">
    <header class="game-header">
      <h1>🏓 Ping Pong</h1>
    </header>

    <section class="controls" aria-label="ตั้งค่าเกม">
      <div class="control-group">
        <label for="gameMode">โหมดเกม</label>
        <select id="gameMode">
          <option value="ai">เล่นกับ AI</option>
          <option value="pvp">ผู้เล่น 2 คน</option>
        </select>
      </div>

      <div id="difficultyGroup" class="control-group">
        <label for="difficulty">ระดับ AI</label>
        <select id="difficulty">
          <option value="easy">ง่าย</option>
          <option value="medium" selected>ปานกลาง</option>
          <option value="hard">ยาก</option>
        </select>
      </div>

      <div class="control-group">
        <label for="winScore">แต้มที่ชนะ</label>
        <select id="winScore">
          <option value="5">5 แต้ม</option>
          <option value="11" selected>11 แต้ม</option>
          <option value="21">21 แต้ม</option>
        </select>
      </div>

      <div class="control-group">
        <label for="obstacles">อุปสรรค</label>
        <select id="obstacles">
          <option value="off">ปิด</option>
          <option value="few" selected>น้อย</option>
          <option value="many">มาก</option>
        </select>
      </div>

      <button id="newGameButton" class="action-button" type="button">
        เริ่มเกมใหม่
      </button>

      <button id="pauseButton" class="action-button secondary" type="button">
        ⏸ หยุดชั่วคราว
      </button>

      <button id="orientationButton" class="action-button secondary" type="button">
        ↔ แนวซ้าย-ขวา
      </button>

      <button id="soundButton" class="action-button secondary" type="button">
        🔊 เสียง: เปิด
      </button>

      <button id="fullscreenButton" class="action-button secondary" type="button">
        ⛶ เต็มจอ
      </button>
    </section>

    <div class="field-wrapper">
      <canvas id="field" aria-label="สนาม Ping Pong"></canvas>

      <div id="overlay" class="overlay">
        <div id="overlayTitle" class="overlay-title">พร้อมหรือยัง?</div>
        <div id="overlayText" class="overlay-text">แตะหรือกด Space เพื่อเริ่ม</div>
      </div>
    </div>

    <p id="instructions" class="instructions"></p>
  </main>

  <script>
    "use strict";

    // Logical field size; the canvas is scaled to fit the screen.
    const FIELD_WIDTH = 800;
    const FIELD_HEIGHT = 500;
    const PADDLE_WIDTH = 14;
    const PADDLE_HEIGHT = 90;
    const PADDLE_MARGIN = 24;
    const PADDLE_KEY_SPEED = 520;
    const BALL_SIZE = 14;
    const BALL_START_SPEED = 380;
    const BALL_MAX_SPEED = 900;
    const BALL_SPEEDUP = 1.06;
    const MAX_BOUNCE_ANGLE = Math.PI / 3.2;

    const AI_LEVELS = {
      easy: { speed: 240, reaction: 0.3, error: 80 },
      medium: { speed: 330, reaction: 0.24, error: 72 },
      hard: { speed: 440, reaction: 0.16, error: 60 }
    };

    const canvas = document.getElementById("field");
    const context = canvas.getContext("2d");
    const fieldWrapper = document.querySelector(".field-wrapper");
    const overlayElement = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const gameModeElement = document.getElementById("gameMode");
    const difficultyElement = document.getElementById("difficulty");
    const difficultyGroup = document.getElementById("difficultyGroup");
    const winScoreElement = document.getElementById("winScore");
    const newGameButton = document.getElementById("newGameButton");
    const pauseButton = document.getElementById("pauseButton");
    const soundButton = document.getElementById("soundButton");
    const orientationButton = document.getElementById("orientationButton");
    const instructionsElement = document.getElementById("instructions");
    const obstaclesElement = document.getElementById("obstacles");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const ORIENTATION_STORAGE_KEY = "pingpong-orientation";
    const OBSTACLES_STORAGE_KEY = "pingpong-obstacles";

    // ---------- Obstacles & power-ups ----------
    const MAX_BALLS = 3;
    const BALL_SUBSTEP = 6; // max px a ball moves per physics substep
    const SPAWN_MIN_X = 180;
    const SPAWN_MAX_X = 620;
    const OBSTACLE_FADE_IN = 0.6;
    const OBSTACLE_MAX_HITS = 3;
    const POWER_UP_RADIUS = 14;
    const POWER_UP_LIFE = 10;
    const EFFECT_DURATION = 8;
    const PADDLE_BIG = 130;
    const PADDLE_SMALL = 60;

    const OBSTACLE_LEVELS = {
      off: null,
      few: { maxObstacles: 2, maxPowerUps: 1 },
      many: { maxObstacles: 4, maxPowerUps: 2 }
    };

    const POWER_UP_TYPES = {
      fast: { icon: "⚡", label: "⚡ ลูกเร็ว!", color: "#facc15" },
      grow: { icon: "⬆", label: "⬆ ไม้ใหญ่!", color: "#4ade80" },
      shrink: { icon: "⬇", label: "⬇ ไม้คู่แข่งเล็ก!", color: "#fb923c" },
      multi: { icon: "3", label: "🔴 แตกเป็น 3 ลูก!", color: "#f87171" }
    };

    const leftPaddle = createPaddle(PADDLE_MARGIN);
    const rightPaddle = createPaddle(
      FIELD_WIDTH - PADDLE_MARGIN - PADDLE_WIDTH
    );

    let balls = [];
    let obstacles = [];
    let powerUps = [];
    let floatTexts = [];
    let obstacleSpawnTimer = 0;
    let powerUpSpawnTimer = 0;
    // Side that last touched a ball; power-ups benefit this side.
    let lastHitter = "left";

    // "ready" (waiting to serve), "playing", "paused", "over"
    let state = "ready";
    let leftScore = 0;
    let rightScore = 0;
    let serveDirection = 1;
    let lastFrameTime = 0;
    let aiTargetY = FIELD_HEIGHT / 2;
    let aiReactionTimer = 0;
    let soundOn = true;
    let audioContext = null;

    // "horizontal": paddles left/right. "vertical": the same game rotated
    // 90° so the left player sits at the bottom and the right player on top.
    let orientation = "horizontal";

    const pressedKeys = new Set();
    // pointerId -> "left" | "right"
    const activePointers = new Map();

    function createPaddle(x) {
      return {
        x,
        y: (FIELD_HEIGHT - PADDLE_HEIGHT) / 2,
        height: PADDLE_HEIGHT,
        effectTimer: 0,
        targetY: null
      };
    }

    function getPaddle(side) {
      return side === "left" ? leftPaddle : rightPaddle;
    }

    function otherSide(side) {
      return side === "left" ? "right" : "left";
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function getObstacleLevel() {
      return OBSTACLE_LEVELS[obstaclesElement.value] || null;
    }

    function isAIMode() {
      return gameModeElement.value === "ai";
    }

    function isVertical() {
      return orientation === "vertical";
    }

    function getSideName(side) {
      if (side === "left") {
        return isVertical() ? "ผู้เล่นล่าง" : "ผู้เล่นซ้าย";
      }

      return isVertical() ? "ผู้เล่นบน" : "ผู้เล่นขวา";
    }

    // Keys that move each paddle toward smaller / larger field y.
    function getKeyBindings() {
      if (isVertical()) {
        const bottomExtra = isAIMode() ? ["KeyA"] : [];
        const bottomExtraDown = isAIMode() ? ["KeyD"] : [];

        return {
          leftUp: ["ArrowLeft", ...bottomExtra],
          leftDown: ["ArrowRight", ...bottomExtraDown],
          rightUp: ["KeyA"],
          rightDown: ["KeyD"]
        };
      }

      return {
        leftUp: ["KeyW", ...(isAIMode() ? ["ArrowUp"] : [])],
        leftDown: ["KeyS", ...(isAIMode() ? ["ArrowDown"] : [])],
        rightUp: ["ArrowUp"],
        rightDown: ["ArrowDown"]
      };
    }

    function startNewGame() {
      leftScore = 0;
      rightScore = 0;
      serveDirection = Math.random() < 0.5 ? -1 : 1;

      for (const paddle of [leftPaddle, rightPaddle]) {
        resetPaddleSize(paddle);
        paddle.y = (FIELD_HEIGHT - PADDLE_HEIGHT) / 2;
        paddle.targetY = null;
      }

      obstacles = [];
      powerUps = [];
      floatTexts = [];
      resetSpawnTimers();

      resetBall();
      state = "ready";
      showOverlay("พร้อมหรือยัง?", "แตะสนามหรือกด Space เพื่อเริ่ม");
      updatePauseButton();
    }

    function resetSpawnTimers() {
      obstacleSpawnTimer = randomBetween(2, 4);
      powerUpSpawnTimer = randomBetween(5, 9);
    }

    function resetPaddleSize(paddle) {
      setPaddleHeight(paddle, PADDLE_HEIGHT);
      paddle.effectTimer = 0;
    }

    // Change height while keeping the paddle centred where it is.
    function setPaddleHeight(paddle, height) {
      const center = paddle.y + paddle.height / 2;
      paddle.height = height;
      paddle.y = center - height / 2;
      clampPaddle(paddle);
    }

    function createBall(x, y, angle, speed, direction) {
      return {
        x,
        y,
        speed,
        velocityX: Math.cos(angle) * speed * direction,
        velocityY: Math.sin(angle) * speed
      };
    }

    function resetBall() {
      const angle = (Math.random() * 2 - 1) * (Math.PI / 6);

      balls = [
        createBall(
          (FIELD_WIDTH - BALL_SIZE) / 2,
          (FIELD_HEIGHT - BALL_SIZE) / 2,
          angle,
          BALL_START_SPEED,
          serveDirection
        )
      ];

      // The server is the side the ball travels away from.
      lastHitter = serveDirection > 0 ? "left" : "right";
      aiTargetY = FIELD_HEIGHT / 2;
    }

    function serve() {
      unlockAudio();
      hideOverlay();
      state = "playing";
      updatePauseButton();
    }

    function togglePause() {
      if (state === "playing") {
        state = "paused";
        showOverlay("หยุดชั่วคราว", "แตะสนามหรือกด Space เพื่อเล่นต่อ");
      } else if (state === "paused" || state === "ready") {
        serve();
      } else if (state === "over") {
        startNewGame();
      }

      updatePauseButton();
    }

    function updatePauseButton() {
      pauseButton.textContent = state === "playing"
        ? "⏸ หยุดชั่วคราว"
        : "▶ เล่นต่อ";
    }

    function showOverlay(title, text) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayElement.classList.remove("hidden");
    }

    function hideOverlay() {
      overlayElement.classList.add("hidden");
    }

    function update(deltaTime) {
      const keys = getKeyBindings();

      updatePlayerPaddle(leftPaddle, keys.leftUp, keys.leftDown, deltaTime);

      if (isAIMode()) {
        updateAIPaddle(deltaTime);
      } else {
        updatePlayerPaddle(
          rightPaddle,
          keys.rightUp,
          keys.rightDown,
          deltaTime
        );
      }

      updateFloatTexts(deltaTime);

      if (state !== "playing") {
        return;
      }

      updatePaddleEffects(deltaTime);
      updateObstacles(deltaTime);
      updatePowerUps(deltaTime);

      // Iterate over a copy: balls can be removed (scored) or added (split).
      for (const ball of [...balls]) {
        updateBall(ball, deltaTime);

        if (state !== "playing") {
          return; // game over
        }
      }

      if (balls.length === 0) {
        endRally();
      }
    }

    // Moves one ball in small substeps so fast balls can't tunnel
    // through paddles or obstacles.
    function updateBall(ball, deltaTime) {
      const distance =
        Math.max(Math.abs(ball.velocityX), Math.abs(ball.velocityY)) * deltaTime;
      const steps = Math.max(1, Math.ceil(distance / BALL_SUBSTEP));
      const stepTime = deltaTime / steps;

      for (let i = 0; i < steps; i++) {
        ball.x += ball.velocityX * stepTime;
        ball.y += ball.velocityY * stepTime;

        if (ball.y <= 0) {
          ball.y = 0;
          ball.velocityY = Math.abs(ball.velocityY);
          playSound(300, 0.04);
        } else if (ball.y + BALL_SIZE >= FIELD_HEIGHT) {
          ball.y = FIELD_HEIGHT - BALL_SIZE;
          ball.velocityY = -Math.abs(ball.velocityY);
          playSound(300, 0.04);
        }

        if (ball.velocityX < 0 && hitsPaddle(leftPaddle, ball)) {
          bounceOffPaddle(leftPaddle, 1, ball);
        } else if (ball.velocityX > 0 && hitsPaddle(rightPaddle, ball)) {
          bounceOffPaddle(rightPaddle, -1, ball);
        }

        collideObstacles(ball);
        collectPowerUps(ball);

        if (ball.x + BALL_SIZE < 0 || ball.x > FIELD_WIDTH) {
          balls.splice(balls.indexOf(ball), 1);
          awardPoint(ball.x > FIELD_WIDTH ? "left" : "right");
          return;
        }
      }
    }

    function updatePlayerPaddle(paddle, upKeys, downKeys, deltaTime) {
      let direction = 0;

      if (upKeys.some(key => pressedKeys.has(key))) {
        direction -= 1;
      }

      if (downKeys.some(key => pressedKeys.has(key))) {
        direction += 1;
      }

      if (direction !== 0) {
        paddle.targetY = null;
        paddle.y += Math.sign(direction) * PADDLE_KEY_SPEED * deltaTime;
      } else if (paddle.targetY !== null) {
        // Follow the finger/mouse closely but smoothly.
        const follow = Math.min(1, deltaTime * 25);
        paddle.y += (paddle.targetY - paddle.y) * follow;
      }

      clampPaddle(paddle);
    }

    function updateAIPaddle(deltaTime) {
      const level = AI_LEVELS[difficultyElement.value];

      aiReactionTimer -= deltaTime;

      if (aiReactionTimer <= 0) {
        aiReactionTimer = level.reaction;

        const target = state === "playing" ? pickAIBall() : null;

        if (target) {
          aiTargetY =
            predictBallY(rightPaddle.x, target) +
            (Math.random() * 2 - 1) * level.error;
        } else {
          aiTargetY = FIELD_HEIGHT / 2;
        }
      }

      const paddleCenter = rightPaddle.y + rightPaddle.height / 2;
      const distance = aiTargetY - paddleCenter;
      const step = level.speed * deltaTime;

      if (Math.abs(distance) > 4) {
        rightPaddle.y += Math.max(-step, Math.min(step, distance));
      }

      clampPaddle(rightPaddle);
    }

    // The ball heading toward the AI that will arrive first.
    function pickAIBall() {
      let best = null;
      let bestTime = Infinity;

      for (const ball of balls) {
        if (ball.velocityX <= 0) {
          continue;
        }

        const time = (rightPaddle.x - (ball.x + BALL_SIZE)) / ball.velocityX;

        if (time > -0.05 && time < bestTime) {
          bestTime = time;
          best = ball;
        }
      }

      return best;
    }

    function predictBallY(targetX, ball) {
      const time = (targetX - (ball.x + BALL_SIZE)) / ball.velocityX;
      const span = FIELD_HEIGHT - BALL_SIZE;
      let y = ball.y + ball.velocityY * Math.max(0, time);

      // Unfold wall bounces.
      y = ((y % (2 * span)) + 2 * span) % (2 * span);

      if (y > span) {
        y = 2 * span - y;
      }

      return y + BALL_SIZE / 2;
    }

    function clampPaddle(paddle) {
      paddle.y = Math.max(
        0,
        Math.min(FIELD_HEIGHT - paddle.height, paddle.y)
      );
    }

    function hitsPaddle(paddle, ball) {
      return (
        ball.x < paddle.x + PADDLE_WIDTH &&
        ball.x + BALL_SIZE > paddle.x &&
        ball.y < paddle.y + paddle.height &&
        ball.y + BALL_SIZE > paddle.y
      );
    }

    function bounceOffPaddle(paddle, direction, ball) {
      const paddleCenter = paddle.y + paddle.height / 2;
      const ballCenter = ball.y + BALL_SIZE / 2;
      const offset = Math.max(
        -1,
        Math.min(1, (ballCenter - paddleCenter) / (paddle.height / 2))
      );
      const angle = offset * MAX_BOUNCE_ANGLE;

      ball.speed = Math.min(BALL_MAX_SPEED, ball.speed * BALL_SPEEDUP);
      ball.velocityX = Math.cos(angle) * ball.speed * direction;
      ball.velocityY = Math.sin(angle) * ball.speed;

      ball.x = direction > 0
        ? paddle.x + PADDLE_WIDTH
        : paddle.x - BALL_SIZE;

      lastHitter = direction > 0 ? "left" : "right";
      playSound(520, 0.05);
    }

    // ---------- Obstacles ----------

    function rectsOverlap(a, b, margin = 0) {
      return (
        a.x < b.x + b.w + margin &&
        a.x + a.w + margin > b.x &&
        a.y < b.y + b.h + margin &&
        a.y + a.h + margin > b.y
      );
    }

    // Random free spot in the middle of the field, or null if none found.
    function findSpawnSpot(w, h, moving) {
      const centerBox = {
        x: FIELD_WIDTH / 2 - 50,
        y: FIELD_HEIGHT / 2 - 50,
        w: 100,
        h: 100
      };
      // A moving block could slide onto the serve point, so keep it out of
      // the whole centre column.
      const centerColumn = { x: FIELD_WIDTH / 2 - 50, y: 0, w: 100, h: FIELD_HEIGHT };

      for (let attempt = 0; attempt < 10; attempt++) {
        const rect = {
          x: randomBetween(SPAWN_MIN_X, SPAWN_MAX_X - w),
          y: randomBetween(10, FIELD_HEIGHT - h - 10),
          w,
          h
        };

        if (rectsOverlap(rect, moving ? centerColumn : centerBox)) {
          continue;
        }

        if (balls.some(ball => rectsOverlap(
          rect,
          { x: ball.x, y: ball.y, w: BALL_SIZE, h: BALL_SIZE },
          60
        ))) {
          continue;
        }

        if (obstacles.some(o => rectsOverlap(rect, o, 20))) {
          continue;
        }

        if (powerUps.some(p => rectsOverlap(rect, {
          x: p.x - POWER_UP_RADIUS,
          y: p.y - POWER_UP_RADIUS,
          w: POWER_UP_RADIUS * 2,
          h: POWER_UP_RADIUS * 2
        }, 20))) {
          continue;
        }

        return rect;
      }

      return null;
    }

    function spawnObstacle() {
      const moving = Math.random() < 0.5;
      const spot = findSpawnSpot(
        randomBetween(16, 24),
        randomBetween(50, 90),
        moving
      );

      if (!spot) {
        return;
      }

      obstacles.push({
        ...spot,
        vy: moving ? randomBetween(40, 90) * (Math.random() < 0.5 ? -1 : 1) : 0,
        hits: OBSTACLE_MAX_HITS,
        life: randomBetween(8, 14),
        spawnFade: OBSTACLE_FADE_IN
      });
    }

    function updateObstacles(deltaTime) {
      for (const o of obstacles) {
        o.spawnFade = Math.max(0, o.spawnFade - deltaTime);
        o.life -= deltaTime;

        if (o.vy !== 0) {
          o.y += o.vy * deltaTime;

          if (o.y < 0) {
            o.y = 0;
            o.vy = Math.abs(o.vy);
          } else if (o.y + o.h > FIELD_HEIGHT) {
            o.y = FIELD_HEIGHT - o.h;
            o.vy = -Math.abs(o.vy);
          }
        }
      }

      obstacles = obstacles.filter(o => o.life > 0 && o.hits > 0);

      const level = getObstacleLevel();

      if (!level) {
        return;
      }

      obstacleSpawnTimer -= deltaTime;

      if (obstacleSpawnTimer <= 0) {
        obstacleSpawnTimer = randomBetween(3, 6);

        if (obstacles.length < level.maxObstacles) {
          spawnObstacle();
        }
      }
    }

    function collideObstacles(ball) {
      const ballRect = { x: ball.x, y: ball.y, w: BALL_SIZE, h: BALL_SIZE };

      for (const o of obstacles) {
        // Still materialising (or already broken): the ball passes through.
        if (o.spawnFade > 0 || o.hits <= 0 || !rectsOverlap(ballRect, o)) {
          continue;
        }

        // Push the ball out along the axis with the smallest overlap.
        const overlapLeft = ball.x + BALL_SIZE - o.x;
        const overlapRight = o.x + o.w - ball.x;
        const overlapTop = ball.y + BALL_SIZE - o.y;
        const overlapBottom = o.y + o.h - ball.y;

        if (Math.min(overlapLeft, overlapRight) < Math.min(overlapTop, overlapBottom)) {
          if (overlapLeft < overlapRight) {
            ball.x = o.x - BALL_SIZE;
            ball.velocityX = -Math.abs(ball.velocityX);
          } else {
            ball.x = o.x + o.w;
            ball.velocityX = Math.abs(ball.velocityX);
          }
        } else if (overlapTop < overlapBottom) {
          ball.y = o.y - BALL_SIZE;
          ball.velocityY = -Math.abs(ball.velocityY);
        } else {
          ball.y = o.y + o.h;
          ball.velocityY = Math.abs(ball.velocityY);
        }

        o.hits--;
        playSound(420, 0.04);
        return;
      }
    }

    // ---------- Power-ups ----------

    function spawnPowerUp() {
      const types = Object.keys(POWER_UP_TYPES).filter(
        type => type !== "multi" || balls.length < MAX_BALLS
      );
      const spot = findSpawnSpot(POWER_UP_RADIUS * 2, POWER_UP_RADIUS * 2, false);

      if (!spot) {
        return;
      }

      powerUps.push({
        x: spot.x + POWER_UP_RADIUS,
        y: spot.y + POWER_UP_RADIUS,
        type: types[Math.floor(Math.random() * types.length)],
        life: POWER_UP_LIFE
      });
    }

    function updatePowerUps(deltaTime) {
      for (const p of powerUps) {
        p.life -= deltaTime;
      }

      powerUps = powerUps.filter(p => p.life > 0);

      const level = getObstacleLevel();

      if (!level) {
        return;
      }

      powerUpSpawnTimer -= deltaTime;

      if (powerUpSpawnTimer <= 0) {
        powerUpSpawnTimer = randomBetween(7, 12);

        if (powerUps.length < level.maxPowerUps) {
          spawnPowerUp();
        }
      }
    }

    function collectPowerUps(ball) {
      const centerX = ball.x + BALL_SIZE / 2;
      const centerY = ball.y + BALL_SIZE / 2;
      const reach = POWER_UP_RADIUS + BALL_SIZE / 2;

      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];

        if (Math.hypot(p.x - centerX, p.y - centerY) < reach) {
          powerUps.splice(i, 1);
          applyPowerUp(p, ball);
        }
      }
    }

    function applyPowerUp(powerUp, ball) {
      const info = POWER_UP_TYPES[powerUp.type];

      if (powerUp.type === "fast") {
        balls.forEach(b => scaleBallSpeed(b, 1.35));
      } else if (powerUp.type === "grow") {
        const paddle = getPaddle(lastHitter);
        setPaddleHeight(paddle, PADDLE_BIG);
        paddle.effectTimer = EFFECT_DURATION;
      } else if (powerUp.type === "shrink") {
        const paddle = getPaddle(otherSide(lastHitter));
        setPaddleHeight(paddle, PADDLE_SMALL);
        paddle.effectTimer = EFFECT_DURATION;
      } else if (powerUp.type === "multi") {
        splitBall(ball);
      }

      playSound(760, 0.08);
      floatTexts.push({
        x: powerUp.x,
        y: powerUp.y,
        text: info.label,
        color: info.color,
        life: 1.2
      });
    }

    function scaleBallSpeed(ball, factor) {
      const newSpeed = Math.min(BALL_MAX_SPEED, ball.speed * factor);
      const ratio = newSpeed / ball.speed;

      ball.velocityX *= ratio;
      ball.velocityY *= ratio;
      ball.speed = newSpeed;
    }

    // Adds up to two copies of the ball, angled ±25°.
    function splitBall(ball) {
      const direction = Math.sign(ball.velocityX) || 1;
      const angle = Math.atan2(ball.velocityY, Math.abs(ball.velocityX));
      const spread = Math.PI * 25 / 180;

      for (const delta of [-spread, spread]) {
        if (balls.length >= MAX_BALLS) {
          break;
        }

        // Keep copies from flying almost straight up/down.
        const newAngle = Math.max(
          -MAX_BOUNCE_ANGLE,
          Math.min(MAX_BOUNCE_ANGLE, angle + delta)
        );

        balls.push(createBall(ball.x, ball.y, newAngle, ball.speed, direction));
      }
    }

    function updatePaddleEffects(deltaTime) {
      for (const paddle of [leftPaddle, rightPaddle]) {
        if (paddle.effectTimer > 0) {
          paddle.effectTimer -= deltaTime;

          if (paddle.effectTimer <= 0) {
            resetPaddleSize(paddle);
          }
        }
      }
    }

    function updateFloatTexts(deltaTime) {
      for (const t of floatTexts) {
        t.life -= deltaTime;
      }

      floatTexts = floatTexts.filter(t => t.life > 0);
    }

    // ---------- Scoring ----------

    // Adds a point; returns true if that point ended the game.
    function awardPoint(side) {
      if (side === "left") {
        leftScore++;
        serveDirection = 1;
      } else {
        rightScore++;
        serveDirection = -1;
      }

      playSound(180, 0.18);

      const winScore = Number(winScoreElement.value);

      if (leftScore < winScore && rightScore < winScore) {
        return false;
      }

      state = "over";

      const winner = leftScore > rightScore
        ? (isAIMode() ? "คุณชนะ! 🎉" : `${getSideName("left")}ชนะ! 🎉`)
        : (isAIMode() ? "AI ชนะ" : `${getSideName("right")}ชนะ! 🎉`);

      showOverlay(
        winner,
        `${leftScore} : ${rightScore} — แตะเพื่อเริ่มเกมใหม่`
      );
      updatePauseButton();
      clearRallyEffects();
      resetBall();
      return true;
    }

    // Called once the last ball of a rally has left the field.
    function endRally() {
      clearRallyEffects();
      resetBall();
      state = "ready";
      showOverlay(
        `${leftScore} : ${rightScore}`,
        "แตะสนามหรือกด Space เพื่อเสิร์ฟ"
      );
      updatePauseButton();
    }

    // Power-ups and paddle effects last one rally; obstacles stay.
    function clearRallyEffects() {
      powerUps = [];
      resetPaddleSize(leftPaddle);
      resetPaddleSize(rightPaddle);
    }

    // ---------- Drawing ----------

    function draw() {
      context.clearRect(0, 0, getViewWidth(), getViewHeight());

      drawScores();

      context.save();

      // Vertical layout: rotate the field so field x runs bottom → top
      // (screen x = field y, screen y = FIELD_WIDTH - field x).
      if (isVertical()) {
        context.translate(0, FIELD_WIDTH);
        context.rotate(-Math.PI / 2);
      }

      // Center line
      context.fillStyle = "rgba(255, 255, 255, 0.18)";

      for (let y = 10; y < FIELD_HEIGHT; y += 30) {
        context.fillRect(FIELD_WIDTH / 2 - 2, y, 4, 16);
      }

      obstacles.forEach(drawObstacle);
      powerUps.forEach(drawPowerUp);

      drawPaddle(leftPaddle, "#38bdf8");
      drawPaddle(rightPaddle, "#f472b6");

      // Balls
      context.fillStyle = "#f8fafc";
      context.shadowColor = "rgba(248, 250, 252, 0.8)";
      context.shadowBlur = 14;

      for (const ball of balls) {
        context.beginPath();
        context.arc(
          ball.x + BALL_SIZE / 2,
          ball.y + BALL_SIZE / 2,
          BALL_SIZE / 2,
          0,
          Math.PI * 2
        );
        context.fill();
      }

      context.shadowBlur = 0;

      context.restore();

      drawFloatTexts();
    }

    const OBSTACLE_COLORS = ["#f0abfc", "#c084fc", "#a78bfa"]; // by hits left

    function drawObstacle(o) {
      let alpha = Math.min(1, o.life); // fade out during the last second

      if (o.spawnFade > 0) {
        // Blink while materialising; the ball passes through meanwhile.
        alpha = Math.floor(o.spawnFade * 10) % 2 ? 0.15 : 0.4;
      }

      const color = OBSTACLE_COLORS[Math.max(0, o.hits - 1)];

      context.globalAlpha = alpha;
      context.fillStyle = color;
      context.shadowColor = color;
      context.shadowBlur = 12;
      roundRect(o.x, o.y, o.w, o.h, 5);
      context.fill();
      context.shadowBlur = 0;
      context.globalAlpha = 1;
    }

    function drawPowerUp(p) {
      const info = POWER_UP_TYPES[p.type];
      // Pulse, and blink during the last 2 seconds.
      const pulse = 1 + Math.sin(performance.now() / 160) * 0.08;
      const alpha = p.life < 2 && Math.floor(p.life * 6) % 2 ? 0.35 : 1;

      context.save();
      context.globalAlpha = alpha;
      context.translate(p.x, p.y);

      // Keep the icon upright when the field is rotated.
      if (isVertical()) {
        context.rotate(Math.PI / 2);
      }

      context.fillStyle = info.color;
      context.shadowColor = info.color;
      context.shadowBlur = 18;
      context.beginPath();
      context.arc(0, 0, POWER_UP_RADIUS * pulse, 0, Math.PI * 2);
      context.fill();
      context.shadowBlur = 0;

      context.fillStyle = "#0f172a";
      context.font = "900 16px system-ui, -apple-system, sans-serif";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(info.icon, 0, 1);
      context.restore();
    }

    // Field coordinates → unrotated drawing coordinates.
    function toViewPosition(x, y) {
      return isVertical()
        ? { x: y, y: FIELD_WIDTH - x }
        : { x, y };
    }

    function drawFloatTexts() {
      context.font = "800 20px system-ui, -apple-system, sans-serif";
      context.textAlign = "center";
      context.textBaseline = "middle";

      for (const t of floatTexts) {
        const position = toViewPosition(t.x, t.y);
        const rise = (1.2 - t.life) * 30;
        const viewWidth = getViewWidth();
        // Keep the label inside the field.
        const x = Math.max(90, Math.min(viewWidth - 90, position.x));

        context.globalAlpha = Math.min(1, t.life / 0.4);
        context.fillStyle = t.color;
        context.fillText(t.text, x, position.y - 24 - rise);
      }

      context.globalAlpha = 1;
    }

    // Scores are drawn unrotated so the digits stay upright.
    function drawScores() {
      context.font = "800 64px system-ui, -apple-system, sans-serif";
      context.fillStyle = "rgba(255, 255, 255, 0.22)";

      if (isVertical()) {
        context.textAlign = "left";
        context.textBaseline = "bottom";
        context.fillText(rightScore, 24, FIELD_WIDTH / 2 - 14);
        context.textBaseline = "top";
        context.fillText(leftScore, 24, FIELD_WIDTH / 2 + 14);
        return;
      }

      context.textAlign = "center";
      context.textBaseline = "top";
      context.fillText(leftScore, FIELD_WIDTH / 4, 24);
      context.fillText(rightScore, (FIELD_WIDTH * 3) / 4, 24);
    }

    // Size of the drawing area in field units, after any rotation.
    function getViewWidth() {
      return isVertical() ? FIELD_HEIGHT : FIELD_WIDTH;
    }

    function getViewHeight() {
      return isVertical() ? FIELD_WIDTH : FIELD_HEIGHT;
    }

    function drawPaddle(paddle, color) {
      context.fillStyle = color;
      context.shadowColor = color;
      context.shadowBlur = paddle.height === PADDLE_HEIGHT ? 16 : 26;
      roundRect(paddle.x, paddle.y, PADDLE_WIDTH, paddle.height, 7);
      context.fill();
      context.shadowBlur = 0;
    }

    function roundRect(x, y, width, height, radius) {
      context.beginPath();
      context.moveTo(x + radius, y);
      context.arcTo(x + width, y, x + width, y + height, radius);
      context.arcTo(x + width, y + height, x, y + height, radius);
      context.arcTo(x, y + height, x, y, radius);
      context.arcTo(x, y, x + width, y, radius);
      context.closePath();
    }

    function gameLoop(time) {
      // Clamp the step so a backgrounded tab doesn't teleport the ball.
      const deltaTime = Math.min(0.033, (time - lastFrameTime) / 1000 || 0);
      lastFrameTime = time;

      update(deltaTime);
      draw();

      window.requestAnimationFrame(gameLoop);
    }

    // ---------- Input: touch / pen / mouse ----------

    function toFieldPosition(event) {
      const rect = canvas.getBoundingClientRect();
      const fractionX = (event.clientX - rect.left) / rect.width;
      const fractionY = (event.clientY - rect.top) / rect.height;

      if (isVertical()) {
        return {
          x: (1 - fractionY) * FIELD_WIDTH,
          y: fractionX * FIELD_HEIGHT
        };
      }

      return {
        x: fractionX * FIELD_WIDTH,
        y: fractionY * FIELD_HEIGHT
      };
    }

    function getSideForPosition(position) {
      if (isAIMode()) {
        return "left";
      }

      return position.x < FIELD_WIDTH / 2 ? "left" : "right";
    }

    function movePaddleToPointer(side, position) {
      const paddle = getPaddle(side);
      paddle.targetY = position.y - paddle.height / 2;
    }

    function handlePointerDown(event) {
      event.preventDefault();

      const position = toFieldPosition(event);
      const side = getSideForPosition(position);

      activePointers.set(event.pointerId, side);

      if (canvas.setPointerCapture) {
        canvas.setPointerCapture(event.pointerId);
      }

      movePaddleToPointer(side, position);
    }

    function handlePointerMove(event) {
      const position = toFieldPosition(event);

      if (activePointers.has(event.pointerId)) {
        event.preventDefault();
        movePaddleToPointer(activePointers.get(event.pointerId), position);
        return;
      }

      // A mouse hovering over the field steers the player's paddle.
      if (event.pointerType === "mouse") {
        movePaddleToPointer(getSideForPosition(position), position);
      }
    }

    function handlePointerEnd(event) {
      activePointers.delete(event.pointerId);
    }

    canvas.addEventListener("pointerdown", handlePointerDown);
    canvas.addEventListener("pointermove", handlePointerMove);
    canvas.addEventListener("pointerup", handlePointerEnd);
    canvas.addEventListener("pointercancel", handlePointerEnd);
    canvas.addEventListener("contextmenu", event => event.preventDefault());

    // Let the mouse line up the paddle while the "ready" overlay is showing.
    overlayElement.addEventListener("pointermove", handlePointerMove);

    overlayElement.addEventListener("pointerdown", event => {
      event.preventDefault();
      togglePause();

      // Let the finger that served keep steering the paddle.
      if (state === "playing") {
        handlePointerDown(event);
      }
    });

    // Stop iOS Safari from scrolling or zooming while playing.
    document.addEventListener(
      "touchmove",
      event => {
        if (event.target === canvas || event.target.closest(".overlay")) {
          event.preventDefault();
        }
      },
      { passive: false }
    );

    document.addEventListener("gesturestart", event => event.preventDefault());

    // ---------- Input: keyboard ----------

    const GAME_KEYS = new Set([
      "KeyW", "KeyS", "KeyA", "KeyD",
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "KeyF"
    ]);

    window.addEventListener("keydown", event => {
      if (event.target.tagName === "SELECT") {
        return;
      }

      if (GAME_KEYS.has(event.code)) {
        event.preventDefault();
      }

      if (event.code === "KeyF") {
        if (!event.repeat) {
          toggleFullscreen();
        }

        return;
      }

      if (event.code === "Space") {
        if (!event.repeat) {
          togglePause();
        }

        return;
      }

      pressedKeys.add(event.code);
    });

    window.addEventListener("keyup", event => {
      pressedKeys.delete(event.code);

      // Stop Space from also clicking a focused button.
      if (GAME_KEYS.has(event.code) && event.target.tagName !== "SELECT") {
        event.preventDefault();
      }
    });

    window.addEventListener("blur", () => {
      pressedKeys.clear();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state === "playing") {
        togglePause();
      }
    });

    // ---------- Sound ----------

    function unlockAudio() {
      // iOS only allows audio after a user gesture.
      if (!soundOn) {
        return;
      }

      if (!audioContext) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
          return;
        }

        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playSound(frequency, duration) {
      if (!soundOn || !audioContext) {
        return;
      }

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;

      oscillator.type = "square";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration);
    }

    function toggleSound() {
      soundOn = !soundOn;
      soundButton.textContent = soundOn ? "🔊 เสียง: เปิด" : "🔇 เสียง: ปิด";

      if (soundOn) {
        unlockAudio();
      }
    }

    // ---------- Layout ----------

    function fitFieldToScreen() {
      // Make the whole field visible without scrolling, e.g. on an iPad
      // in landscape where the viewport is short.
      const wrapperTop =
        fieldWrapper.getBoundingClientRect().top + window.scrollY;
      const availableHeight =
        window.innerHeight - Math.min(wrapperTop, 260) - 90;
      const viewWidth = getViewWidth();
      const viewHeight = getViewHeight();
      const widthByHeight =
        Math.max(320, availableHeight) * (viewWidth / viewHeight);

      document.documentElement.style.setProperty(
        "--field-width",
        `min(100%, ${Math.floor(widthByHeight)}px)`
      );

      // Render at device resolution so it stays sharp on Retina screens.
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 3);
      const displayWidth = canvas.clientWidth || viewWidth;
      const scale = (displayWidth * pixelRatio) / viewWidth;

      canvas.width = Math.round(viewWidth * scale);
      canvas.height = Math.round(viewHeight * scale);
      canvas.style.aspectRatio = `${viewWidth} / ${viewHeight}`;
      canvas.style.height = `${(displayWidth * viewHeight) / viewWidth}px`;
      context.setTransform(scale, 0, 0, scale, 0, 0);

      draw();
    }

    let resizeFrame = null;

    function handleResize() {
      if (resizeFrame !== null) {
        window.cancelAnimationFrame(resizeFrame);
      }

      resizeFrame = window.requestAnimationFrame(() => {
        resizeFrame = null;
        fitFieldToScreen();
      });
    }

    function updateControlVisibility() {
      difficultyGroup.classList.toggle("hidden", !isAIMode());
      updateInstructions();
    }

    function updateInstructions() {
      if (isVertical()) {
        instructionsElement.innerHTML =
          "iPad / โทรศัพท์: ลากนิ้วซ้าย-ขวาบนครึ่งสนามของคุณเพื่อขยับไม้ " +
          "(โหมด 2 คน: คนละครึ่งสนาม ใช้นิ้วพร้อมกันได้)<br>" +
          (isAIMode()
            ? "คอมพิวเตอร์: ← / → หรือ A / D หรือเมาส์ · Space หยุด/เล่นต่อ · F เต็มจอ"
            : "คอมพิวเตอร์: ผู้เล่นล่างใช้ ← / → หรือเมาส์ · " +
              "ผู้เล่นบนใช้ A / D · Space หยุด/เล่นต่อ · F เต็มจอ");
        return;
      }

      instructionsElement.innerHTML =
        "iPad / โทรศัพท์: ลากนิ้วขึ้น-ลงบนครึ่งสนามของคุณเพื่อขยับไม้ " +
        "(โหมด 2 คน: คนละครึ่งสนาม ใช้นิ้วพร้อมกันได้)<br>" +
        (isAIMode()
          ? "คอมพิวเตอร์: W / S หรือ ↑ / ↓ หรือเมาส์ · Space หยุด/เล่นต่อ · F เต็มจอ"
          : "คอมพิวเตอร์: ผู้เล่นซ้ายใช้ W / S หรือเมาส์ · " +
            "ผู้เล่นขวาใช้ ↑ / ↓ · Space หยุด/เล่นต่อ · F เต็มจอ");
    }

    function setOrientation(newOrientation) {
      orientation = newOrientation;

      orientationButton.textContent = isVertical()
        ? "↕ แนวบน-ล่าง"
        : "↔ แนวซ้าย-ขวา";

      // Don't keep the ball flying while the field turns under the player.
      if (state === "playing") {
        togglePause();
      }

      pressedKeys.clear();
      activePointers.clear();
      leftPaddle.targetY = null;
      rightPaddle.targetY = null;

      updateInstructions();
      fitFieldToScreen();
    }

    function toggleOrientation() {
      setOrientation(isVertical() ? "horizontal" : "vertical");

      try {
        localStorage.setItem(ORIENTATION_STORAGE_KEY, orientation);
      } catch (error) {
        // Storage can be unavailable (private mode); the choice just won't persist.
      }
    }

    function getInitialOrientation() {
      try {
        const saved = localStorage.getItem(ORIENTATION_STORAGE_KEY);

        if (saved === "horizontal" || saved === "vertical") {
          return saved;
        }
      } catch (error) {
        // Fall through to the screen-shape default.
      }

      // A tall screen (e.g. iPad or phone held upright) plays better top-bottom.
      return window.innerHeight > window.innerWidth ? "vertical" : "horizontal";
    }

    // ---------- Obstacle setting ----------

    function getInitialObstacles() {
      try {
        const saved = localStorage.getItem(OBSTACLES_STORAGE_KEY);

        if (Object.prototype.hasOwnProperty.call(OBSTACLE_LEVELS, saved)) {
          return saved;
        }
      } catch (error) {
        // Storage unavailable; use the default.
      }

      return "few";
    }

    function handleObstaclesChange() {
      try {
        localStorage.setItem(OBSTACLES_STORAGE_KEY, obstaclesElement.value);
      } catch (error) {
        // The choice just won't persist.
      }

      startNewGame();
    }

    // ---------- Fullscreen ----------

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function isFullscreenSupported() {
      const root = document.documentElement;
      return Boolean(root.requestFullscreen || root.webkitRequestFullscreen);
    }

    function toggleFullscreen() {
      if (!isFullscreenSupported()) {
        return;
      }

      let result;

      if (getFullscreenElement()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        result = exit.call(document);
      } else {
        const root = document.documentElement;
        const request = root.requestFullscreen || root.webkitRequestFullscreen;
        result = request.call(root);
      }

      // Some browsers return a promise that rejects (e.g. not allowed).
      if (result && typeof result.catch === "function") {
        result.catch(() => {});
      }
    }

    function handleFullscreenChange() {
      fullscreenButton.textContent = getFullscreenElement()
        ? "🗗 ออกจากเต็มจอ"
        : "⛶ เต็มจอ";
      handleResize();
    }

    // iPhone Safari has no Fullscreen API for pages.
    fullscreenButton.classList.toggle("hidden", !isFullscreenSupported());
    fullscreenButton.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", handleFullscreenChange);
    document.addEventListener("webkitfullscreenchange", handleFullscreenChange);

    gameModeElement.addEventListener("change", () => {
      updateControlVisibility();
      startNewGame();
    });

    orientationButton.addEventListener("click", toggleOrientation);
    obstaclesElement.value = getInitialObstacles();
    obstaclesElement.addEventListener("change", handleObstaclesChange);

    winScoreElement.addEventListener("change", startNewGame);
    newGameButton.addEventListener("click", startNewGame);
    pauseButton.addEventListener("click", togglePause);
    soundButton.addEventListener("click", toggleSound);
    window.addEventListener("resize", handleResize);
    window.addEventListener("orientationchange", handleResize);

    updateControlVisibility();
    startNewGame();
    setOrientation(getInitialOrientation());
    window.requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
